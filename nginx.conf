# Serves the built demo, and hands the browser's API calls to Odoo on the very
# same hostname.
#
# One origin means one link to share: no `?api=` for a client to copy and no
# 127.0.0.1, which on a client's laptop is the client's own machine. This is
# what makes a deployed demo — https://smartspend-demo.example.com/ — work by
# itself, and the same file serves the local stack on :8090.
#
#   Browser ──▶ nginx ──▶ /            the built demo
#                    ├──▶ /config.js   which backend the portal should call
#                    └──▶ /api/…       proxied to Odoo, which stays unpublished

# Odoo's own scheme, unless something in front (Caddy, a load balancer) already
# said what the browser used. Odoo builds absolute URLs from it.
map $http_x_forwarded_proto $smartspend_proto {
    default $http_x_forwarded_proto;
    ''      $scheme;
}

server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Read before the portal starts, to learn its backend. Answered here rather
    # than baked into the build, so one build runs everywhere: on the deployed
    # host and on :8090 it is told this origin; on a static host with no nginx
    # (GitHub Pages) the placeholder in the build names nothing, so the portal
    # falls back and runs the offline sample.
    location = /config.js {
        default_type application/javascript;
        add_header Cache-Control "no-store";
        return 200 "window.SMARTSPEND_API = window.location.origin;\n";
    }

    # The module's REST API. Resolved through Docker's DNS at request time, so
    # nginx still starts when Odoo is not up yet and follows it if it moves.
    location /api/ {
        resolver 127.0.0.11 ipv6=off valid=30s;
        set $smartspend_odoo "web:8069";
        proxy_pass http://$smartspend_odoo$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $smartspend_proto;
        proxy_set_header X-Forwarded-Host $host;
        # Odoo answers a long request (a launch, a bid) well inside this.
        proxy_connect_timeout 10s;
        proxy_read_timeout 120s;
        # Attachments a requester uploads travel through here.
        client_max_body_size 32m;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
