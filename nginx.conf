# The demo's built-in default backend is 127.0.0.1:8019 — the *native* Odoo.
# This stack's Odoo is on 8079, so a bare visit to :8090 was silently writing to
# the other install. Point it at this stack's backend instead, so the plain URL
# is the right one and nobody has to remember a query string.
server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    location = / {
        # Only when no ?api= was given, so an explicit one still wins and this
        # cannot loop.
        if ($args = "") {
            # $http_host, not a bare path: nginx listens on 80 inside the
            # container, so an absolute redirect built from that loses the
            # published :8090 the browser is actually using.
            return 302 "$scheme://$http_host/?api=http://127.0.0.1:8079";
        }
        try_files /index.html =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
